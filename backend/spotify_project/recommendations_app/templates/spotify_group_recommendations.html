{% extends 'base.html' %}

{% block content %}

<div class="container" style="max-width: 800px; margin: auto; padding-top: 40px;">
    
    <h2 style="text-align: center;">Group Music Recommender</h2>

    <div class="wireframe-container">
        
        <div class="section-box">
            <h3>Host a Room</h3>
            <br>
            <form action="{% url 'spotify_group_rec' %}" method="POST"> 
                {% csrf_token %}
                <input type="hidden" name="action" value="create_room">
                <button type="submit" class="my-btn">Create</button>
            </form>
        </div>

        <div class="section-box">
            <h3>Join a Room</h3>
            <br>
            <form action="{% url 'spotify_group_rec' %}" method="POST">
                {% csrf_token %}
                <input type="hidden" name="action" value="join_room">
                
                <input type="text" name="room_code" class="my-input" placeholder="Enter Code" maxlength="4" required>
                <button type="submit" class="my-btn">Join</button>
            </form>
        </div>

    </div>
    
    <br>
    <div style="text-align: center;">
        <a href="{% url 'home' %}" class="link">
            &larr; Back to Home
        </a>
    </div>

</div>

{% endblock %}
